[project]
name = "my-life-calendar"
version = "0.1.0"
description = "My life calendar"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [{ name = "Simone Rigoni" }]
dependencies = [
    "django>=5.2.13",
    "lxml>=6.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
]


[project.urls]
Repository = "https://github.com/simonerigoni/my_life_calendar"
Medium = "https://medium.com/@simone-rigoni01/funny-little-python-project-my-life-calendar-aa1e751a69a0"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle/pyflakes defaults plus import sorting (I), pyupgrade (UP), and flake8-bugbear (B)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["hello_world_app", "home_app", "my_life_calendar_app"]
python_files = ["tests.py", "test_*.py"]
addopts = "--ds=my_life_calendar_project.settings"

[tool.coverage.run]
source = ["hello_world_app", "home_app", "my_life_calendar_app", "my_life_calendar_project"]
omit = ["*/migrations/*", "*/tests.py"]
